<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="JC Yard" />
  <meta name="theme-color" content="#1a4d2e" />
  <title>JC Trading — Yard Inventory</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root {
      --bg: #f4f7f5;
      --card: #fff;
      --ink: #14201a;
      --muted: #5a6b62;
      --brand: #1a4d2e;
      --brand2: #2d6a4f;
      --line: #d7e0db;
      --danger: #9b2226;
      --ok: #2d6a4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.35;
    }
    header {
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      color: #fff;
      padding: 1rem 1rem 1.15rem;
      position: sticky;
      top: 0;
      z-index: 5;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }
    header h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
    header p { margin: .35rem 0 0; opacity: .9; font-size: .85rem; }
    main { padding: 1rem; max-width: 640px; margin: 0 auto 5rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: .9rem 1rem;
      margin-bottom: .85rem;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: .25rem; }
    input, select, textarea {
      width: 100%;
      font: inherit;
      padding: .65rem .7rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      margin-bottom: .7rem;
    }
    textarea { min-height: 72px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5rem; }
    .item {
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: .75rem;
      margin-bottom: .65rem;
      background: #fafcfb;
    }
    .item h3 { margin: 0 0 .55rem; font-size: .92rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: .4rem; border: 0; border-radius: 10px; padding: .8rem 1rem;
      font: inherit; font-weight: 700; cursor: pointer; width: 100%;
    }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-secondary { background: #e8f0eb; color: var(--brand); }
    .btn-ghost { background: transparent; color: var(--danger); border: 1px solid #f0c2c4; }
    .hint { font-size: .78rem; color: var(--muted); margin: .2rem 0 .8rem; }
    .pill {
      display: inline-block; background: #e8f0eb; color: var(--brand);
      font-size: .72rem; font-weight: 700; padding: .2rem .5rem; border-radius: 999px;
    }
    footer {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: #fff; border-top: 1px solid var(--line);
      padding: .65rem 1rem calc(.65rem + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 16px rgba(0,0,0,.06);
    }
    footer .wrap { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.4fr; gap: .5rem; }
    .locked { font-size: .72rem; color: var(--muted); text-align: center; margin-top: .45rem; }
    .err { color: var(--danger); font-size: .85rem; margin: .4rem 0; display: none; }
    a.navlink { color: var(--brand); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1>Yard Inventory</h1>
    <p>JC Trading · on-hand stock update</p>
  </header>
  <main>
    <div class="card">
      <span class="pill" id="acctPill">Private link</span>
      <p class="hint" style="margin-top:.55rem">Walk the yard, record what you have on hand, tap Send. Goes only to JC Trading — cannot be redirected.</p>
      <label for="company">Your company</label>
      <input id="company" autocomplete="organization" placeholder="e.g. Jorgensen Trading" />
      <div class="row">
        <div>
          <label for="contact">Your name</label>
          <input id="contact" autocomplete="name" placeholder="Who to call back" />
        </div>
        <div>
          <label for="phone">Cell (optional)</label>
          <input id="phone" inputmode="tel" autocomplete="tel" placeholder="for text back" />
        </div>
      </div>
      <label for="shipCity">Ship / yard city (no street needed)</label>
      <input id="shipCity" placeholder="e.g. Nokomis, FL" />
    </div>

    <div class="card">
      <h2 style="margin:0 0 .55rem;font-size:1rem">On-hand lines</h2>
      <div id="items"></div>
      <button type="button" class="btn btn-secondary" id="addItem">+ Add line</button>
    </div>

    <div class="card">
      <label for="timing">Timing (optional)</label>
      <textarea id="timing" placeholder="e.g. as of today / cycle count"></textarea>
      <label for="notes">Other notes</label>
      <textarea id="notes" placeholder="Anything else Jeremy should know"></textarea>
    </div>
    <p class="err" id="err"></p>
    <p class="hint" style="text-align:center;margin:.5rem 0 1.5rem">
      <a id="yardLink" class="navlink" href="index.html">← Back to yard need list</a>
    </p>
  </main>

  <footer>
    <div class="wrap">
      <button type="button" class="btn btn-secondary" id="preview">Preview</button>
      <button type="button" class="btn btn-primary" id="send">Send to JC Trading</button>
    </div>
    <p class="locked">Locked destination: JCTradingUSA@proton.me</p>
  </footer>

  <script>
    // Hard-locked — never read destination from URL or form fields
    const DEST_EMAIL = "JCTradingUSA@proton.me";

    const params = new URLSearchParams(location.search);
    const token = (params.get("t") || params.get("token") || "DEMO").trim();
    const presetCompany = (params.get("c") || params.get("company") || "").trim();
    const presetCity = (params.get("city") || "").trim();

    document.getElementById("acctPill").textContent = "Account token: " + token;
    if (presetCompany) document.getElementById("company").value = presetCompany;
    if (presetCity) document.getElementById("shipCity").value = presetCity;
    (function () {
      const a = document.getElementById("yardLink");
      if (a && location.search) a.href = "index.html" + location.search;
    })();

    const SIZES = ["2x4","2x6","2x8","2x10","2x12","4x4","4x6","Other"];
    const GRADES = ["#1","#1 Common","#1 Prime","#2","#2 Common","#2 Prime","MSR 1650","MSR 2100","MSR 2400","Other"];
    const LENGTHS = ["8","10","12","14","16","18","20","22","24","mixed / even tally","open"];

    function itemCard(n) {
      const el = document.createElement("div");
      el.className = "item";
      el.dataset.n = n;
      el.innerHTML = `
        <h3>Line ${n} <button type="button" class="btn btn-ghost" style="width:auto;padding:.25rem .55rem;float:right;font-size:.75rem" data-rm>Remove</button></h3>
        <div class="row">
          <div><label>Size</label><select data-f="size">${SIZES.map(s=>`<option>${s}</option>`).join("")}</select></div>
          <div><label>Grade</label><select data-f="grade">${GRADES.map(s=>`<option>${s}</option>`).join("")}</select></div>
        </div>
        <div class="row">
          <div><label>Lengths</label><select data-f="lengths">${LENGTHS.map(s=>`<option>${s}</option>`).join("")}</select></div>
          <div><label>On hand qty</label><input data-f="onhand" inputmode="decimal" placeholder="pcs / MBF / units" /></div>
        </div>
        <label>Note (optional)</label>
        <input data-f="note" placeholder="e.g. wet / damaged / reserved" />
      `;
      el.querySelector("[data-rm]").onclick = () => {
        if (document.querySelectorAll(".item").length <= 1) return;
        el.remove();
        renumber();
      };
      return el;
    }

    function renumber() {
      [...document.querySelectorAll(".item")].forEach((el, i) => {
        el.querySelector("h3").childNodes[0].textContent = `Line ${i + 1} `;
      });
    }

    const itemsRoot = document.getElementById("items");
    itemsRoot.appendChild(itemCard(1));
    document.getElementById("addItem").onclick = () => {
      itemsRoot.appendChild(itemCard(itemsRoot.children.length + 1));
    };

    function collect() {
      const items = [...document.querySelectorAll(".item")].map((el, i) => {
        const g = (f) => el.querySelector(`[data-f="${f}"]`).value.trim();
        return {
          n: i + 1,
          size: g("size"),
          grade: g("grade"),
          lengths: g("lengths"),
          onhand: g("onhand"),
          note: g("note")
        };
      });
      return {
        token,
        company: document.getElementById("company").value.trim(),
        contact: document.getElementById("contact").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        shipCity: document.getElementById("shipCity").value.trim(),
        timing: document.getElementById("timing").value.trim(),
        notes: document.getElementById("notes").value.trim(),
        items,
        when: new Date().toISOString()
      };
    }

    function bodyText(d) {
      const lines = [];
      lines.push("JC TRADING — CUSTOMER YARD INVENTORY");
      lines.push("Token: " + d.token);
      lines.push("Company: " + (d.company || "(blank)"));
      lines.push("Contact: " + (d.contact || "(blank)"));
      lines.push("Phone: " + (d.phone || "(blank)"));
      lines.push("Ship/yard city: " + (d.shipCity || "(blank)"));
      lines.push("Submitted (UTC): " + d.when);
      lines.push("");
      lines.push("ON HAND:");
      d.items.forEach((it) => {
        lines.push(`${it.n}. ${it.size} ${it.grade} | lengths ${it.lengths} | on-hand ${it.onhand || "?"}`);
        if (it.note) lines.push("   note: " + it.note);
      });
      lines.push("");
      lines.push("TIMING:");
      lines.push(d.timing || "(none)");
      lines.push("");
      lines.push("OTHER NOTES:");
      lines.push(d.notes || "(none)");
      lines.push("");
      lines.push("---");
      lines.push("Destination locked to JCTradingUSA@proton.me (customer form).");
      return lines.join("\n");
    }

    function validate(d) {
      if (!d.company) return "Add your company name.";
      if (!d.shipCity) return "Add ship / yard city.";
      const hasOnHand = d.items.some((it) => it.onhand);
      if (!hasOnHand) return "Add on-hand qty on at least one line.";
      return "";
    }

    function mailtoHref(d) {
      const subject = `Yard inventory · ${d.company || "customer"} · ${d.shipCity || "city"} · ${d.token}`;
      return `mailto:${DEST_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyText(d))}`;
    }

    document.getElementById("preview").onclick = () => {
      const d = collect();
      const msg = validate(d);
      const err = document.getElementById("err");
      if (msg) { err.style.display = "block"; err.textContent = msg; return; }
      err.style.display = "none";
      alert(bodyText(d));
    };

    document.getElementById("send").onclick = () => {
      const d = collect();
      const msg = validate(d);
      const err = document.getElementById("err");
      if (msg) { err.style.display = "block"; err.textContent = msg; return; }
      err.style.display = "none";
      location.href = mailtoHref(d);
    };

    const KEY = "jc_inv_" + token;
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || "null");
      if (saved) {
        if (saved.company) document.getElementById("company").value = saved.company;
        if (saved.contact) document.getElementById("contact").value = saved.contact;
        if (saved.phone) document.getElementById("phone").value = saved.phone;
        if (saved.shipCity) document.getElementById("shipCity").value = saved.shipCity;
      }
      ["company","contact","phone","shipCity"].forEach((id) => {
        document.getElementById(id).addEventListener("change", () => {
          localStorage.setItem(KEY, JSON.stringify({
            company: document.getElementById("company").value,
            contact: document.getElementById("contact").value,
            phone: document.getElementById("phone").value,
            shipCity: document.getElementById("shipCity").value
          }));
        });
      });
    } catch (e) {}
  </script>
</body>
</html>
